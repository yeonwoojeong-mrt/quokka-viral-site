<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>나뭇잎 러시</title>
<link rel="preload" href="assets/fonts/DOSSaemmul-subset.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family:'DOS Saemmul';
    src:url('assets/fonts/DOSSaemmul-subset.woff2') format('woff2');
    font-display:swap;
  }
  :root{
    --ink:#33251a;
    --paper:#fff9f0;
    --card-bg:#fffdf8;
    --accent:#c1502e;
    --leaf:#4f9a4a;
    --font-display:'DOS Saemmul','Malgun Gothic',sans-serif;
  }
  [hidden]{ display:none!important; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:var(--font-display); color:var(--ink);
    background:#1b1330; overflow:hidden; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .stage{
    position:fixed; inset:0; z-index:0;
    background:url('assets/bg1.webp') center/cover no-repeat;
  }
  .wrap{
    position:relative; z-index:1;
    max-width:460px; height:100%; margin:0 auto;
    display:flex; flex-direction:column;
    padding:16px; box-sizing:border-box;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  }
  .hud-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .counter-badge{
    background:rgba(255,253,248,.92); padding:8px 18px; border-radius:999px;
    font-size:17px; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .counter-badge b{ color:var(--accent); font-size:20px; }
  .counter-badge.bump{ animation:badgeBump .45s ease; }
  @keyframes badgeBump{
    0%{ transform:scale(1); } 22%{ transform:scale(1.22); }
    42%{ transform:scale(.95); } 64%{ transform:scale(1.12); } 100%{ transform:scale(1); }
  }
  .sound-toggle{
    width:44px; height:44px; border-radius:50%; border:none;
    background:rgba(255,253,248,.92); font-size:18px; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .sound-toggle:active{ transform:scale(.94); }

  .play-area{ position:relative; flex:1; overflow:hidden; }
  .quokka-wrap{
    position:absolute; left:50%; bottom:4%; transform:translateX(-50%);
    width:min(58vw,280px); aspect-ratio:600/630;
  }
  .quokka-img{ width:100%; height:100%; object-fit:contain; display:block; transform-origin:50% 70%; }
  .quokka-img.chomp{ animation:chomp .22s ease; }
  @keyframes chomp{
    0%{ transform:scale(1,1); } 40%{ transform:scale(1.05,.93); } 100%{ transform:scale(1,1); }
  }

  .hint{
    position:absolute; top:-30px; left:50%; transform:translateX(-50%);
    font-size:13.5px; color:var(--paper); text-align:center; white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.55);
    transition:opacity .3s ease;
  }
  .hint.hidden{ opacity:0; }

  .falling-item{
    position:absolute; width:72px; height:72px;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:pointer;
    z-index:2;
  }
  .falling-item img{
    width:68%; display:block; pointer-events:none;
    -webkit-user-drag:none; user-drag:none; -webkit-user-select:none; user-select:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));
  }
  .falling-item .meat-emoji{
    font-size:46px; line-height:1; pointer-events:none; user-select:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));
  }

  .overlay{
    position:fixed; inset:0; z-index:5;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,10,10,.4);
    padding:16px; box-sizing:border-box;
  }
  .card{
    position:relative;
    background:var(--card-bg); border:3px solid #3a2a1c; border-radius:18px;
    padding:28px 24px 24px; text-align:center; width:min(86vw,320px);
    box-shadow:0 10px 24px rgba(0,0,0,.3);
  }
  .card h1{ font-size:21px; margin:0 0 10px; }
  .card p.desc{ font-size:14.5px; line-height:1.55; margin:0 0 20px; color:var(--ink); opacity:.85; }
  .card .result-head{ font-size:15px; font-weight:700; margin:0 0 4px; color:var(--accent); }
  .card .result-time{ font-size:44px; font-weight:700; margin:0 0 4px; font-variant-numeric:tabular-nums; }
  .card .result-best{ font-size:14px; font-weight:700; opacity:.7; margin:0 0 20px; }
  .card .result-best.new{
    color:var(--accent); opacity:1; font-size:16px;
    animation:bestPop .6s cubic-bezier(.2,1.6,.4,1) both, bestBounce 1.4s ease-in-out .6s infinite;
  }
  @keyframes bestPop{ from{ transform:scale(0) rotate(-10deg); opacity:0; } 60%{ transform:scale(1.4) rotate(4deg); opacity:1; } to{ transform:scale(1) rotate(0); } }
  @keyframes bestBounce{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }

  .btn{
    display:block; width:100%; box-sizing:border-box; min-height:50px; margin-top:10px;
    font-family:inherit; font-size:16px; font-weight:700; border:none; border-radius:999px;
    cursor:pointer;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.secondary{ background:transparent; color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }
  .btn.pulse{ animation:ctaPulse 1.3s ease-in-out infinite; }
  @keyframes ctaPulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(193,80,46,.55); }
    35%{ transform:scale(1.045); box-shadow:0 0 0 7px rgba(193,80,46,0); }
    70%{ transform:scale(1); box-shadow:0 0 0 0 rgba(193,80,46,0); }
  }
  .btn-row{ display:flex; gap:8px; margin-top:10px; }
  .btn-row .btn{ margin-top:0; }
  .btn.small{ min-height:38px; font-size:13px; flex:1; }

  .close-x{
    position:absolute; top:10px; right:10px; width:32px; height:32px;
    border-radius:50%; border:none; background:#eee3d0; color:var(--ink);
    font-size:16px; font-weight:700; cursor:pointer; line-height:1;
  }
  .close-x:active{ transform:scale(.92); }
  .mistake-quokka{ width:112px; display:block; margin:4px auto 14px; }
  .mistake-text{ font-size:17px; font-weight:700; margin:0; color:var(--ink); }
</style>
</head>
<body>
<div class="stage"></div>

<div class="wrap">
  <div class="hud-top">
    <div class="counter-badge" id="counterBadge" hidden>나뭇잎 <b id="counterNum">0</b>/<span id="counterGoal">30</span></div>
    <div style="flex:1"></div>
    <button class="sound-toggle" id="soundToggle" aria-label="소리 켜기/끄기">🔊</button>
  </div>

  <div class="play-area" id="playArea">
    <div class="quokka-wrap">
      <img class="quokka-img" id="quokkaImg" src="assets/quokka-eat-closed.webp" alt="쿼카">
      <div class="hint hidden" id="hint">떨어지는 나뭇잎을 콕콕 터치해서 먹여주세요!</div>
    </div>
  </div>
</div>

<div class="overlay" id="startOverlay">
  <div class="card">
    <h1>🍃 나뭇잎 러시</h1>
    <p class="desc">위에서 나뭇잎이랑 고기가 같이 떨어져요!<br>나뭇잎 <b id="startGoalText">30</b>개만 골라서<br>쿼카한테 빨리 줘보세요 🍖🚫</p>
    <button class="btn primary pulse" id="startBtn">시작하기</button>
  </div>
</div>

<div class="overlay" id="overOverlay" hidden>
  <div class="card">
    <p class="result-head" id="resultHead">30개 잘 골라 먹였다!</p>
    <p class="result-time" id="resultTime">0.00초</p>
    <p class="result-best" id="resultBest">베스트 0.00초</p>
    <button class="btn primary pulse" id="applyBtn">호주 공짜여행 응모하기</button>
    <div class="btn-row">
      <button class="btn secondary small" id="shareBtn">공유하기</button>
      <button class="btn secondary small" id="retryBtn">다시하기</button>
    </div>
  </div>
</div>

<div class="overlay" id="mistakeOverlay" hidden>
  <div class="card">
    <button class="close-x" id="mistakeClose" aria-label="닫기">✕</button>
    <img class="mistake-quokka" src="assets/quokka-eat-closed.webp" alt="쿼카">
    <p class="mistake-text">고기는 못 먹는다구용 ㅡㅡ</p>
  </div>
</div>

<script>
(function(){
  'use strict';

  var GOAL = 30;
  var APPLY_URL = 'https://www.myrealtrip.com';
  var FALL_SPEED = 240;        // px/초, 낙하 속도
  var SPAWN_MIN = 140, SPAWN_MAX = 240;  // 생성 간격(ms)
  var MEAT_CHANCE = 0.32;      // 고기가 나올 확률
  var ITEM_MARGIN = 44;        // 화면 좌우 여백(px)

  var EAT_CLOSED = 'assets/quokka-eat-closed.webp';
  var EAT_OPEN = 'assets/quokka-eat-open.webp';
  var BG = 'assets/bg1.webp';
  var LEAF_IMG = 'assets/leaf-bite0.webp';
  var preload = [EAT_CLOSED, EAT_OPEN, BG, LEAF_IMG].map(function(src){
    var im = new Image(); im.src = src; return im;
  });

  var el = {
    playArea: document.getElementById('playArea'),
    counterBadge: document.getElementById('counterBadge'),
    counterNum: document.getElementById('counterNum'),
    counterGoal: document.getElementById('counterGoal'),
    quokkaImg: document.getElementById('quokkaImg'),
    hint: document.getElementById('hint'),
    startOverlay: document.getElementById('startOverlay'),
    startGoalText: document.getElementById('startGoalText'),
    startBtn: document.getElementById('startBtn'),
    overOverlay: document.getElementById('overOverlay'),
    resultHead: document.getElementById('resultHead'),
    resultTime: document.getElementById('resultTime'),
    resultBest: document.getElementById('resultBest'),
    applyBtn: document.getElementById('applyBtn'),
    shareBtn: document.getElementById('shareBtn'),
    retryBtn: document.getElementById('retryBtn'),
    soundToggle: document.getElementById('soundToggle'),
    mistakeOverlay: document.getElementById('mistakeOverlay'),
    mistakeClose: document.getElementById('mistakeClose')
  };
  el.counterGoal.textContent = String(GOAL);
  el.startGoalText.textContent = String(GOAL);
  el.resultHead.textContent = GOAL + '개 잘 골라 먹였다!';

  // ---------- 상태 ----------
  var state = 'idle';   // idle | ready | playing | over
  var count = 0, t0 = 0, elapsed = 0;
  var paused = false;   // 실수 팝업 떠있는 동안 true (낙하/생성만 멈춤, 기록 시계는 계속 흐름)
  var items = [];        // 현재 떨어지고 있는 아이템들

  var BEST_KEY = 'leafRush.bestTime';
  var bestTime = 0;
  try { bestTime = parseFloat(localStorage.getItem(BEST_KEY)) || 0; } catch(e){}
  function saveBest(){ try { localStorage.setItem(BEST_KEY, String(bestTime)); } catch(e){} }

  // ---------- 사운드 (합성음) ----------
  var soundOn = true;
  var audioCtx = null;
  function getAudioCtx(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function noiseBurst(ctx, duration, bandFreq, gainVal){
    var bufferSize = Math.max(1, Math.floor(ctx.sampleRate*duration));
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    var grainCount = 5, grainLen = Math.max(1, Math.floor((bufferSize/grainCount)*1.5));
    for(var g=0; g<grainCount; g++){
      var jitter=(Math.random()*0.5-0.25)*(bufferSize/grainCount);
      var start=Math.floor((g/grainCount)*bufferSize+jitter);
      var amp=0.55+Math.random()*0.45;
      for(var i=0;i<grainLen;i++){
        var idx=start+i; if(idx<0||idx>=bufferSize) continue;
        var gt=i/grainLen, env=Math.sin(Math.PI*gt)*amp;
        data[idx]+=(Math.random()*2-1)*env;
      }
    }
    for(var j=0;j<bufferSize;j++){ data[j]*=(1-(j/bufferSize)*0.3); }
    var noise=ctx.createBufferSource(); noise.buffer=buffer;
    var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
    var bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=bandFreq; bp.Q.value=0.6;
    var gain=ctx.createGain(); gain.gain.value=gainVal;
    noise.connect(hp); hp.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
    noise.start();
  }
  function playEatSound(){
    if(!soundOn) return;
    var ctx = getAudioCtx(); if(!ctx) return;
    noiseBurst(ctx, 0.13, 650 + Math.random()*80, 0.5);
    setTimeout(function(){ var c = getAudioCtx(); if(c) noiseBurst(c, 0.13, 540 + Math.random()*80, 0.45); }, 100);
  }
  function playMistakeSound(){
    if(!soundOn) return;
    var ctx = getAudioCtx(); if(!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(180, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(85, ctx.currentTime + 0.25);
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.3);
  }
  el.soundToggle.addEventListener('click', function(){
    soundOn = !soundOn;
    el.soundToggle.textContent = soundOn ? '🔊' : '🔇';
  });

  function triggerHaptic(ms){
    if(!navigator.vibrate) return;
    try { navigator.vibrate(ms || 10); } catch(e){}
  }

  // ---------- HUD ----------
  function updateCounter(){ el.counterNum.textContent = String(Math.min(count, GOAL)); }
  function bumpCounter(){
    el.counterBadge.classList.remove('bump');
    void el.counterBadge.offsetWidth;
    el.counterBadge.classList.add('bump');
  }
  function chewOnce(){
    el.quokkaImg.src = EAT_OPEN;
    el.quokkaImg.classList.remove('chomp');
    void el.quokkaImg.offsetWidth;
    el.quokkaImg.classList.add('chomp');
    setTimeout(function(){ el.quokkaImg.src = EAT_CLOSED; }, 110);
  }

  // ---------- 떨어지는 아이템 ----------
  // 매번 독립적으로 랜덤을 뽑으면 우연히 한쪽이 연달아 몰리기 쉬워서,
  // 정해진 비율로 섞은 "가방"에서 하나씩 뽑고 다 떨어지면 다시 섞는 방식으로 고르게 배분한다
  var BAG_SIZE = 10;
  var bag = [];
  function refillBag(){
    bag = [];
    var meatCount = Math.max(1, Math.round(BAG_SIZE * MEAT_CHANCE));
    for(var i = 0; i < BAG_SIZE; i++) bag.push(i < meatCount ? 'meat' : 'leaf');
    for(var j = bag.length - 1; j > 0; j--){
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = bag[j]; bag[j] = bag[k]; bag[k] = tmp;
    }
  }
  function nextType(){
    if(bag.length === 0) refillBag();
    return bag.pop();
  }

  function spawnItem(){
    var r = el.playArea.getBoundingClientRect();
    if(r.width < ITEM_MARGIN * 2 + 10) return;
    var type = nextType();
    var wrap = document.createElement('div');
    wrap.className = 'falling-item';
    if(type === 'leaf'){
      wrap.innerHTML = '<img src="' + LEAF_IMG + '" alt="나뭇잎" draggable="false">';
    } else {
      wrap.innerHTML = '<span class="meat-emoji">🍖</span>';
    }
    var x = ITEM_MARGIN + Math.random() * (r.width - ITEM_MARGIN * 2);
    var y = -46;
    wrap.style.left = x + 'px';
    wrap.style.top = y + 'px';
    el.playArea.appendChild(wrap);
    var it = { el:wrap, type:type, x:x, y:y, grabbed:false };
    bindItemEvents(it);
    items.push(it);
  }

  function removeItem(it){
    var idx = items.indexOf(it);
    if(idx >= 0) items.splice(idx, 1);
    if(it.el.parentNode) it.el.parentNode.removeChild(it.el);
  }

  function resolveFeed(it){
    it.grabbed = false;
    removeItem(it);
    if(it.type === 'leaf'){
      count++;
      bumpCounter();
      updateCounter();
      chewOnce();
      playEatSound();
      triggerHaptic(10);
      if(count >= GOAL) finishGame();
    } else {
      showMistake();
    }
  }

  function bindItemEvents(it){
    it.el.addEventListener('pointerdown', function(e){
      if(state !== 'ready' && state !== 'playing') return;
      if(it.grabbed) return;
      e.preventDefault();
      it.grabbed = true;   // 중복 처리 방지용 플래그 (더 이상 드래그는 안 함, 터치 즉시 처리)
      el.hint.classList.add('hidden');
      if(state === 'ready'){ state = 'playing'; t0 = performance.now(); }
      resolveFeed(it);
    });
    it.el.addEventListener('touchstart', function(e){ e.preventDefault(); }, { passive:false });
    it.el.addEventListener('dragstart', function(e){ e.preventDefault(); });
  }

  function showMistake(){
    paused = true;
    playMistakeSound();
    triggerHaptic([15, 40, 15]);
    el.mistakeOverlay.hidden = false;
  }
  el.mistakeClose.addEventListener('click', function(){
    el.mistakeOverlay.hidden = true;
    paused = false;
  });

  // ---------- 메인 루프 ----------
  var lastTime = 0, spawnAcc = 0, nextSpawnGap = SPAWN_MIN;
  function loop(now){
    if(!lastTime) lastTime = now;
    var dt = Math.min((now - lastTime) / 1000, 1 / 20);
    lastTime = now;
    if((state === 'ready' || state === 'playing') && !paused){
      spawnAcc += dt * 1000;
      if(spawnAcc >= nextSpawnGap){
        spawnAcc = 0;
        nextSpawnGap = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
        spawnItem();
      }
      var r = el.playArea.getBoundingClientRect();
      for(var i = items.length - 1; i >= 0; i--){
        var it = items[i];
        if(it.grabbed) continue;
        it.y += FALL_SPEED * dt;
        it.el.style.top = it.y + 'px';
        if(it.y - 50 > r.height){ removeItem(it); }
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function clearItems(){
    items.forEach(function(it){ if(it.el.parentNode) it.el.parentNode.removeChild(it.el); });
    items = [];
  }

  // ---------- 진행 ----------
  function startGame(){
    state = 'ready';
    count = 0; elapsed = 0; paused = false;
    spawnAcc = 0; nextSpawnGap = SPAWN_MIN; lastTime = 0;
    bag = [];
    clearItems();
    updateCounter();
    el.counterBadge.hidden = false;
    el.startOverlay.hidden = true;
    el.overOverlay.hidden = true;
    el.mistakeOverlay.hidden = true;
    el.hint.classList.remove('hidden');
    getAudioCtx();
  }

  function finishGame(){
    state = 'over';
    elapsed = (performance.now() - t0) / 1000;
    clearItems();
    var isNew = bestTime === 0 || elapsed < bestTime;
    if(isNew){ bestTime = elapsed; saveBest(); }
    el.resultTime.textContent = elapsed.toFixed(2) + '초';
    el.resultBest.textContent = isNew ? '베스트 기록 갱신!' : '베스트 ' + bestTime.toFixed(2) + '초';
    el.resultBest.classList.toggle('new', isNew);
    el.overOverlay.hidden = false;
  }

  el.startBtn.addEventListener('click', startGame);
  el.retryBtn.addEventListener('click', startGame);
  el.applyBtn.addEventListener('click', function(){
    window.open(APPLY_URL, '_blank', 'noopener,noreferrer');
  });

  // ---------- 공유 ----------
  function shareText(){
    return '쿼카한테 나뭇잎 ' + GOAL + '개 골라 먹이기! ' + elapsed.toFixed(2) + '초 기록!\n'
      + location.href.split(/[?#]/)[0] + '\n#나뭇잎러시 #쿼카섬';
  }
  function resultImageFile(){
    var c = document.createElement('canvas');
    c.width = 600; c.height = 600;
    var g = c.getContext('2d');
    g.fillStyle = '#fff9f0'; g.fillRect(0, 0, 600, 600);
    g.fillStyle = '#33251a'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 40px "DOS Saemmul"'; g.fillText('🍃 나뭇잎 러시', 300, 150);
    g.font = '700 28px "DOS Saemmul"'; g.fillText(GOAL + '개 완주', 300, 220);
    g.fillStyle = '#c1502e';
    g.font = '700 80px "DOS Saemmul"'; g.fillText(elapsed.toFixed(2) + '초', 300, 340);
    g.fillStyle = '#33251a';
    g.font = '700 22px "DOS Saemmul"';
    if(bestTime) g.fillText('베스트 ' + bestTime.toFixed(2) + '초', 300, 410);
    var bin = atob(c.toDataURL('image/png').split(',')[1]);
    var buf = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    return new File([buf], 'leaf-rush-result.png', { type:'image/png' });
  }
  el.shareBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  el.shareBtn.addEventListener('click', function(){
    var text = shareText();
    var file = null;
    try { file = resultImageFile(); } catch(e){}
    if(file && navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ text:text, files:[file] }).catch(function(){});
      return;
    }
    if(navigator.share){
      navigator.share({ text:text }).catch(function(){});
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        el.shareBtn.textContent = '복사했어요!';
        setTimeout(function(){ el.shareBtn.textContent = '공유하기'; }, 1500);
      }).catch(function(){});
    }
  });

  document.addEventListener('keydown', function(e){
    if(state === 'over' && (e.key === ' ' || e.key === 'Enter') && document.activeElement !== el.shareBtn){
      e.preventDefault();
      startGame();
    }
  });
})();
</script>
</body>
</html>
