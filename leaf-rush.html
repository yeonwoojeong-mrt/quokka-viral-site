<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>쿼카 밥주기 게임</title>
<meta property="og:title" content="쿼카 밥주기 게임">
<meta property="og:description" content="쿼카한테 나뭇잎 콕콕 먹여주고 호주 여행 응모해보세요!">
<meta property="og:image" content="https://petmyquokka.netlify.app/assets/og-share.jpg">
<meta property="og:url" content="https://petmyquokka.netlify.app/leaf-rush.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="assets/fonts/OngeulipParkDahyun-subset.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family:'Ongeulip';
    src:url('assets/fonts/OngeulipParkDahyun-subset.woff2') format('woff2');
    font-display:swap;
  }
  :root{
    --ink:#33251a;
    --paper:#fff9f0;
    --card-bg:#fffdf8;
    --accent:#c1502e;
    --leaf:#4f9a4a;
    --font-display:'Ongeulip','Malgun Gothic',sans-serif;
  }
  [hidden]{ display:none!important; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:var(--font-display); color:var(--ink);
    background:#1b1330; overflow:hidden; touch-action:manipulation;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .stage{
    position:fixed; inset:0; z-index:0;
    background:url('assets/bg1.webp') center/cover no-repeat;
  }
  .wrap{
    position:relative; z-index:1;
    max-width:460px; height:100%; margin:0 auto;
    display:flex; flex-direction:column;
    padding:16px; box-sizing:border-box;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  }
  .hud-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .counter-badge{
    background:rgba(255,253,248,.92); padding:8px 18px; border-radius:999px;
    font-size:17px; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .counter-badge b{ color:var(--accent); font-size:20px; }
  .timer-badge{
    background:rgba(255,253,248,.92); padding:8px 14px; border-radius:999px;
    font-size:15px; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.15);
    margin-left:8px; font-variant-numeric:tabular-nums;
  }
  .counter-badge.bump{ animation:badgeBump .45s ease; }
  @keyframes badgeBump{
    0%{ transform:scale(1); } 22%{ transform:scale(1.22); }
    42%{ transform:scale(.95); } 64%{ transform:scale(1.12); } 100%{ transform:scale(1); }
  }
  .sound-toggle{
    width:44px; height:44px; border-radius:50%; border:none;
    font-family:var(--font-display);
    background:rgba(255,253,248,.92); font-size:18px; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .sound-toggle:active{ transform:scale(.94); }

  .play-area{ position:relative; flex:1; overflow:hidden; }
  .quokka-wrap{
    position:absolute; left:50%; bottom:4%; transform:translateX(-50%);
    width:min(58vw,280px); aspect-ratio:600/630;
    transition:bottom .3s ease;
  }
  .play-area.intro .quokka-wrap{ bottom:20%; width:min(62vw,290px); }
  .quokka-img{ width:100%; height:100%; object-fit:contain; display:block; transform-origin:50% 70%; }
  .quokka-img.chomp{ animation:chomp .22s ease; }
  @keyframes chomp{
    0%{ transform:scale(1,1); } 40%{ transform:scale(1.05,.93); } 100%{ transform:scale(1,1); }
  }

  .hint{
    position:absolute; top:-30px; left:50%; transform:translateX(-50%);
    font-size:15.5px; color:var(--paper); text-align:center; white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.55);
    transition:opacity .3s ease;
  }
  .hint.hidden{ opacity:0; }

  .countdown{
    position:absolute; inset:0; z-index:4;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    font-size:110px; font-weight:700; color:#fff;
    text-shadow:
      -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000,
      -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000;
  }
  .countdown.pop{ animation:countdownPop .7s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes countdownPop{
    0%{ transform:scale(.3); opacity:0; }
    35%{ transform:scale(1.15); opacity:1; }
    60%{ transform:scale(1); opacity:1; }
    100%{ transform:scale(1); opacity:0; }
  }

  .quest-dialogue{
    position:absolute; top:16%; left:50%; transform:translateX(-50%);
    width:calc(100% - 40px);
    text-align:center;
    z-index:6; cursor:pointer;
  }
  .quest-text{
    font-size:22px; line-height:1.55; font-weight:700; color:#fff;
    word-break:keep-all; margin:0;
    text-shadow:
      -1px -1px 0 #000, 1px -1px 0 #000,
      -1px 1px 0 #000, 1px 1px 0 #000;
  }
  .quest-text.has-next{ margin-bottom:8px; }
  .quest-next{
    display:inline-block; margin-top:12px;
    font-family:var(--font-display);
    font-size:14.5px; font-weight:700; color:#fff;
    background:var(--accent); padding:8px 18px; border-radius:999px;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
    animation:nextBob .9s ease-in-out infinite;
  }
  @keyframes nextBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(4px); } }

  .falling-item{
    position:absolute; width:72px; height:72px;
    transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    touch-action:none; cursor:pointer;
    z-index:2;
  }
  .falling-item img{
    width:68%; display:block; pointer-events:none;
    -webkit-user-drag:none; user-drag:none; -webkit-user-select:none; user-select:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));
  }
  .falling-item .meat-emoji{
    font-size:46px; line-height:1; pointer-events:none; user-select:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));
  }

  .overlay{
    position:fixed; inset:0; z-index:5;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,10,10,.4);
    padding:16px; box-sizing:border-box;
  }
  .card{
    position:relative;
    background:var(--card-bg); border:3px solid #3a2a1c; border-radius:18px;
    padding:28px 24px 24px; text-align:center; width:min(86vw,320px);
    box-shadow:0 10px 24px rgba(0,0,0,.3);
  }
  .card h1{ font-size:21px; margin:0 0 10px; }
  .card .result-head{ font-size:17px; font-weight:700; margin:0 0 4px; color:var(--accent); }
  .card .result-time{ font-size:44px; font-weight:700; margin:0 0 4px; font-variant-numeric:tabular-nums; }
  .card .result-best{ font-size:14px; font-weight:700; opacity:.7; margin:0 0 10px; }
  .leaderboard{
    list-style:none; margin:0 0 18px; padding:0;
    text-align:left; font-size:13px; max-height:160px; overflow-y:auto;
  }
  .leaderboard:empty{ margin:0 0 4px; }
  .leaderboard li{
    display:flex; align-items:center; gap:8px;
    padding:5px 8px; border-radius:8px; color:var(--ink);
  }
  .leaderboard li .rank{ width:18px; flex:none; opacity:.55; font-weight:700; }
  .leaderboard li .nick{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .leaderboard li .time{ flex:none; font-variant-numeric:tabular-nums; opacity:.8; }
  .leaderboard li.me{ background:#ffe9d9; font-weight:700; }
  .leaderboard li.me .rank{ opacity:1; color:var(--accent); }
  .leaderboard li.me .time{ opacity:1; color:var(--accent); }
  .name-input{
    width:100%; box-sizing:border-box;
    font-family:var(--font-display); -webkit-appearance:none; appearance:none;
    font-size:18px; text-align:center; color:var(--ink);
    background:#faf3e6; border:2px solid rgba(0,0,0,.15);
    border-radius:12px; padding:12px; margin-bottom:12px;
  }
  .name-input:focus{ outline:none; border-color:var(--accent); }
  .name-input::placeholder{ font-family:var(--font-display); color:var(--ink); opacity:.4; }
  .card .result-best.new{
    color:var(--accent); opacity:1; font-size:16px;
    animation:bestPop .6s cubic-bezier(.2,1.6,.4,1) both, bestBounce 1.4s ease-in-out .6s infinite;
  }
  @keyframes bestPop{ from{ transform:scale(0) rotate(-10deg); opacity:0; } 60%{ transform:scale(1.4) rotate(4deg); opacity:1; } to{ transform:scale(1) rotate(0); } }
  @keyframes bestBounce{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.12); } }

  .btn{
    display:block; width:100%; box-sizing:border-box; min-height:50px; margin-top:10px;
    font-family:var(--font-display); -webkit-appearance:none; appearance:none;
    font-size:18px; font-weight:700; border:none; border-radius:999px;
    cursor:pointer;
  }
  .btn:active{ transform:scale(.97); }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.secondary{ background:transparent; color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }
  .btn.pulse{ animation:ctaPulse 1.3s ease-in-out infinite; }
  @keyframes ctaPulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(193,80,46,.55); }
    35%{ transform:scale(1.045); box-shadow:0 0 0 7px rgba(193,80,46,0); }
    70%{ transform:scale(1); box-shadow:0 0 0 0 rgba(193,80,46,0); }
  }
  .btn-row{ display:flex; gap:8px; margin-top:10px; }
  .btn-row .btn{ margin-top:0; }
  .btn.small{ min-height:38px; font-size:13px; flex:1; }

  .close-x{
    position:absolute; top:10px; right:10px; width:32px; height:32px;
    border-radius:50%; border:none; background:#eee3d0; color:var(--ink);
    font-family:var(--font-display);
    font-size:16px; font-weight:700; cursor:pointer; line-height:1;
  }
  .close-x:active{ transform:scale(.92); }
  .mistake-quokka{ width:112px; display:block; margin:4px auto 14px; }
  .mistake-text{ font-size:17px; font-weight:700; margin:0; color:var(--ink); }
</style>
</head>
<body>
<div class="stage"></div>

<div class="wrap">
  <div class="hud-top">
    <div class="counter-badge" id="counterBadge" hidden>나뭇잎 <b id="counterNum">0</b>/<span id="counterGoal">30</span></div>
    <div class="timer-badge" id="timerBadge" hidden>0.0초</div>
    <div style="flex:1"></div>
    <button class="sound-toggle" id="restartBtn" aria-label="다시 시작" hidden>↻</button>
    <button class="sound-toggle" id="soundToggle" aria-label="소리 켜기/끄기">🔊</button>
  </div>

  <div class="play-area intro" id="playArea">
    <div class="quokka-wrap">
      <img class="quokka-img" id="quokkaImg" src="assets/quokka-eat-closed.webp" alt="쿼카">
      <div class="hint hidden" id="hint">떨어지는 나뭇잎을 콕콕 터치해서 먹여주세요!</div>
    </div>
    <div class="countdown" id="countdown" hidden></div>
  </div>

  <div class="quest-dialogue" id="introDialogue">
    <p class="quest-text has-next" id="introText"></p>
    <div class="quest-next" id="introNext" hidden>눌러서 계속 ▼</div>
  </div>

  <div class="quest-dialogue" id="goalDialogue" hidden>
    <p class="quest-text has-next" id="goalText"></p>
    <div class="quest-next" id="goalNext" hidden>쿼카섬 입장하기</div>
  </div>
</div>

<div class="overlay" id="startOverlay" hidden>
  <div class="card">
    <p class="result-head" id="namingText">아이디를 적고 쿼카섬에 입장하세요!</p>
    <input class="name-input" id="nicknameInput" type="text" placeholder="닉네임 (최대 8자)" maxlength="8">
    <button class="btn primary pulse" id="startBtn">입장하기</button>
  </div>
</div>

<div class="overlay" id="overOverlay" hidden>
  <div class="card">
    <p class="result-head" id="resultHead">30개 잘 골라 먹였다!</p>
    <p class="result-time" id="resultTime">0.00초</p>
    <p class="result-best" id="resultBest">전체 최고기록 확인 중...</p>
    <ol class="leaderboard" id="leaderboard"></ol>
    <button class="btn primary pulse" id="applyBtn">호주 공짜여행 응모하기</button>
    <div class="btn-row">
      <button class="btn secondary small" id="shareBtn">공유하기</button>
      <button class="btn secondary small" id="retryBtn">다시하기</button>
    </div>
  </div>
</div>

<div class="overlay" id="mistakeOverlay" hidden>
  <div class="card">
    <button class="close-x" id="mistakeClose" aria-label="닫기">✕</button>
    <img class="mistake-quokka" src="assets/quokka-angry.webp" alt="화난 쿼카">
    <p class="mistake-text">고기는 못 먹는다구용 ㅡㅡ</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';

  // ---------- 성과 트래킹 (Supabase) ----------
  var SUPABASE_URL = 'https://anpikmfeszdpghkbntft.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_QupBa7fFZ2drK4ubwAC_zA_y-091fEG';
  var GAME_NAME = 'leaf_rush';
  var sbClient = null;
  try { sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}
  var VID_KEY = 'mrtGameVisitorId';
  var visitorId = '';
  try {
    visitorId = localStorage.getItem(VID_KEY);
    if(!visitorId){
      visitorId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('v-' + Date.now() + '-' + Math.random().toString(36).slice(2));
      localStorage.setItem(VID_KEY, visitorId);
    }
  } catch(e){ visitorId = 'v-' + Math.random().toString(36).slice(2); }
  function logEvent(eventType, value){
    if(!sbClient) return null;
    var row = { event_type:eventType, game:GAME_NAME, visitor_id:visitorId };
    if(value != null) row.value = value;
    if(nickname) row.nickname = nickname;
    try {
      return sbClient.from('events').insert(row);
    } catch(e){ return null; }
  }
  logEvent('visit');

  function fetchGlobalBest(){
    if(!sbClient) return;
    sbClient.from('best_times').select('best_value').eq('game', GAME_NAME).single().then(function(res){
      var data = res && res.data;
      if(data && data.best_value != null) globalBest = parseFloat(data.best_value);
    }, function(){});
  }
  fetchGlobalBest();

  var GOAL = 30;
  var APPLY_URL = 'https://www.myrealtrip.com';
  var FALL_SPEED = 320;        // px/초, 낙하 속도
  var SPAWN_MIN = 90, SPAWN_MAX = 160;  // 생성 간격(ms)
  var MEAT_CHANCE = 0.32;      // 고기가 나올 확률
  var ITEM_MARGIN = 44;        // 화면 좌우 여백(px)

  var EAT_CLOSED = 'assets/quokka-eat-closed.webp';
  var EAT_OPEN = 'assets/quokka-eat-open.webp';
  var BG = 'assets/bg1.webp';
  var LEAF_IMG = 'assets/leaf-bite0.webp';
  var ANGRY_IMG = 'assets/quokka-angry.webp';
  var HERO_IMG = 'assets/quokka-1.webp';
  var preload = [EAT_CLOSED, EAT_OPEN, BG, LEAF_IMG, ANGRY_IMG, HERO_IMG].map(function(src){
    var im = new Image(); im.src = src; return im;
  });
  var shareBgImg = preload[2], shareHeroImg = preload[5];

  var el = {
    playArea: document.getElementById('playArea'),
    countdown: document.getElementById('countdown'),
    counterBadge: document.getElementById('counterBadge'),
    timerBadge: document.getElementById('timerBadge'),
    restartBtn: document.getElementById('restartBtn'),
    counterNum: document.getElementById('counterNum'),
    counterGoal: document.getElementById('counterGoal'),
    quokkaImg: document.getElementById('quokkaImg'),
    hint: document.getElementById('hint'),
    introDialogue: document.getElementById('introDialogue'),
    introText: document.getElementById('introText'),
    introNext: document.getElementById('introNext'),
    goalDialogue: document.getElementById('goalDialogue'),
    goalText: document.getElementById('goalText'),
    goalNext: document.getElementById('goalNext'),
    startOverlay: document.getElementById('startOverlay'),
    startBtn: document.getElementById('startBtn'),
    nicknameInput: document.getElementById('nicknameInput'),
    overOverlay: document.getElementById('overOverlay'),
    resultHead: document.getElementById('resultHead'),
    resultTime: document.getElementById('resultTime'),
    resultBest: document.getElementById('resultBest'),
    leaderboard: document.getElementById('leaderboard'),
    applyBtn: document.getElementById('applyBtn'),
    shareBtn: document.getElementById('shareBtn'),
    retryBtn: document.getElementById('retryBtn'),
    soundToggle: document.getElementById('soundToggle'),
    mistakeOverlay: document.getElementById('mistakeOverlay'),
    mistakeClose: document.getElementById('mistakeClose')
  };
  el.counterGoal.textContent = String(GOAL);
  el.resultHead.textContent = GOAL + '개 잘 골라 먹였다!';

  // ---------- 상태 ----------
  var state = 'idle';   // idle | playing | over
  var count = 0, t0 = 0, elapsed = 0;
  var paused = false;   // 실수 팝업 떠있는 동안 true (낙하/생성만 멈춤, 기록 시계는 계속 흐름)
  var items = [];        // 현재 떨어지고 있는 아이템들

  var globalBest = null; // 전체 유저 중 최고기록(초) — Supabase에서 받아옴, 공유 이미지 등에 재사용

  var NICK_KEY = 'mrtGameNickname';
  var nickname = '';
  try {
    var savedNick = localStorage.getItem(NICK_KEY);
    if(savedNick) el.nicknameInput.value = savedNick;
  } catch(e){}

  // ---------- 사운드 (합성음) ----------
  var soundOn = true;
  var audioCtx = null;
  function getAudioCtx(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function noiseBurst(ctx, duration, bandFreq, gainVal){
    var bufferSize = Math.max(1, Math.floor(ctx.sampleRate*duration));
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    var grainCount = 5, grainLen = Math.max(1, Math.floor((bufferSize/grainCount)*1.5));
    for(var g=0; g<grainCount; g++){
      var jitter=(Math.random()*0.5-0.25)*(bufferSize/grainCount);
      var start=Math.floor((g/grainCount)*bufferSize+jitter);
      var amp=0.55+Math.random()*0.45;
      for(var i=0;i<grainLen;i++){
        var idx=start+i; if(idx<0||idx>=bufferSize) continue;
        var gt=i/grainLen, env=Math.sin(Math.PI*gt)*amp;
        data[idx]+=(Math.random()*2-1)*env;
      }
    }
    for(var j=0;j<bufferSize;j++){ data[j]*=(1-(j/bufferSize)*0.3); }
    var noise=ctx.createBufferSource(); noise.buffer=buffer;
    var hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
    var bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=bandFreq; bp.Q.value=0.6;
    var gain=ctx.createGain(); gain.gain.value=gainVal;
    noise.connect(hp); hp.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
    noise.start();
  }
  function playEatSound(){
    if(!soundOn) return;
    var ctx = getAudioCtx(); if(!ctx) return;
    noiseBurst(ctx, 0.13, 650 + Math.random()*80, 0.5);
    setTimeout(function(){ var c = getAudioCtx(); if(c) noiseBurst(c, 0.13, 540 + Math.random()*80, 0.45); }, 100);
  }
  function playMistakeSound(){
    if(!soundOn) return;
    var ctx = getAudioCtx(); if(!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(180, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(85, ctx.currentTime + 0.25);
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.3);
  }
  el.soundToggle.addEventListener('click', function(){
    soundOn = !soundOn;
    el.soundToggle.textContent = soundOn ? '🔊' : '🔇';
  });

  function triggerHaptic(ms){
    if(!navigator.vibrate) return;
    try { navigator.vibrate(ms || 10); } catch(e){}
  }

  // ---------- HUD ----------
  function updateCounter(){ el.counterNum.textContent = String(Math.min(count, GOAL)); }
  function bumpCounter(){
    el.counterBadge.classList.remove('bump');
    void el.counterBadge.offsetWidth;
    el.counterBadge.classList.add('bump');
  }
  function chewOnce(){
    el.quokkaImg.src = EAT_OPEN;
    el.quokkaImg.classList.remove('chomp');
    void el.quokkaImg.offsetWidth;
    el.quokkaImg.classList.add('chomp');
    setTimeout(function(){ el.quokkaImg.src = EAT_CLOSED; }, 110);
  }

  // ---------- 떨어지는 아이템 ----------
  // 매번 독립적으로 랜덤을 뽑으면 우연히 한쪽이 연달아 몰리기 쉬워서,
  // 정해진 비율로 섞은 "가방"에서 하나씩 뽑고 다 떨어지면 다시 섞는 방식으로 고르게 배분한다
  var BAG_SIZE = 10;
  var bag = [];
  function refillBag(){
    bag = [];
    var meatCount = Math.max(1, Math.round(BAG_SIZE * MEAT_CHANCE));
    for(var i = 0; i < BAG_SIZE; i++) bag.push(i < meatCount ? 'meat' : 'leaf');
    for(var j = bag.length - 1; j > 0; j--){
      var k = Math.floor(Math.random() * (j + 1));
      var tmp = bag[j]; bag[j] = bag[k]; bag[k] = tmp;
    }
  }
  function nextType(){
    if(bag.length === 0) refillBag();
    return bag.pop();
  }

  function spawnItem(){
    var r = el.playArea.getBoundingClientRect();
    if(r.width < ITEM_MARGIN * 2 + 10) return;
    var type = nextType();
    var wrap = document.createElement('div');
    wrap.className = 'falling-item';
    if(type === 'leaf'){
      wrap.innerHTML = '<img src="' + LEAF_IMG + '" alt="나뭇잎" draggable="false">';
    } else {
      wrap.innerHTML = '<span class="meat-emoji">🍖</span>';
    }
    var x = ITEM_MARGIN + Math.random() * (r.width - ITEM_MARGIN * 2);
    var y = -46;
    wrap.style.left = x + 'px';
    wrap.style.top = y + 'px';
    el.playArea.appendChild(wrap);
    var it = { el:wrap, type:type, x:x, y:y, grabbed:false };
    bindItemEvents(it);
    items.push(it);
  }

  function removeItem(it){
    var idx = items.indexOf(it);
    if(idx >= 0) items.splice(idx, 1);
    if(it.el.parentNode) it.el.parentNode.removeChild(it.el);
  }

  function resolveFeed(it){
    it.grabbed = false;
    removeItem(it);
    if(it.type === 'leaf'){
      count++;
      bumpCounter();
      updateCounter();
      chewOnce();
      playEatSound();
      triggerHaptic(10);
      if(count >= GOAL) finishGame();
    } else {
      showMistake();
    }
  }

  function bindItemEvents(it){
    it.el.addEventListener('pointerdown', function(e){
      if(state !== 'playing') return;
      if(it.grabbed) return;
      e.preventDefault();
      it.grabbed = true;   // 중복 처리 방지용 플래그 (더 이상 드래그는 안 함, 터치 즉시 처리)
      el.hint.classList.add('hidden');
      resolveFeed(it);
    });
    it.el.addEventListener('touchstart', function(e){ e.preventDefault(); }, { passive:false });
    it.el.addEventListener('dragstart', function(e){ e.preventDefault(); });
  }

  function showMistake(){
    paused = true;
    playMistakeSound();
    triggerHaptic([15, 40, 15]);
    el.mistakeOverlay.hidden = false;
  }
  el.mistakeClose.addEventListener('click', function(){
    el.mistakeOverlay.hidden = true;
    paused = false;
  });

  // ---------- 메인 루프 ----------
  var lastTime = 0, spawnAcc = 0, nextSpawnGap = SPAWN_MIN;
  function loop(now){
    if(!lastTime) lastTime = now;
    var dt = Math.min((now - lastTime) / 1000, 1 / 20);
    lastTime = now;
    if(state === 'playing' && !paused){
      spawnAcc += dt * 1000;
      if(spawnAcc >= nextSpawnGap){
        spawnAcc = 0;
        nextSpawnGap = SPAWN_MIN + Math.random() * (SPAWN_MAX - SPAWN_MIN);
        spawnItem();
      }
      var r = el.playArea.getBoundingClientRect();
      for(var i = items.length - 1; i >= 0; i--){
        var it = items[i];
        if(it.grabbed) continue;
        it.y += FALL_SPEED * dt;
        it.el.style.top = it.y + 'px';
        if(it.y - 50 > r.height){ removeItem(it); }
      }
    }
    if(state === 'playing'){
      el.timerBadge.textContent = ((now - t0) / 1000).toFixed(1) + '초';
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function clearItems(){
    items.forEach(function(it){ if(it.el.parentNode) it.el.parentNode.removeChild(it.el); });
    items = [];
  }

  // ---------- 진행 ----------
  function runCountdown(onDone){
    var steps = ['3','2','1','시작!'];
    var i = 0;
    el.countdown.hidden = false;
    function showNext(){
      el.countdown.textContent = steps[i];
      el.countdown.classList.remove('pop');
      void el.countdown.offsetWidth;
      el.countdown.classList.add('pop');
      i++;
      if(i < steps.length){
        setTimeout(showNext, 700);
      } else {
        setTimeout(function(){
          el.countdown.hidden = true;
          onDone();
        }, 500);
      }
    }
    showNext();
  }

  function startGame(){
    getAudioCtx(); // iOS 오디오 언락은 반드시 클릭 핸들러 안에서 동기적으로 호출해야 함
    el.nicknameInput.blur();
    el.playArea.classList.remove('intro');
    paused = false;
    clearItems();
    el.counterNum.textContent = '0';
    el.timerBadge.textContent = '0.0초';
    el.counterBadge.hidden = false;
    el.timerBadge.hidden = false;
    el.restartBtn.hidden = false;
    el.startOverlay.hidden = true;
    el.overOverlay.hidden = true;
    el.leaderboard.innerHTML = '';
    el.mistakeOverlay.hidden = true;
    el.hint.classList.add('hidden');
    runCountdown(beginPlay);
  }

  function beginPlay(){
    logEvent('game_start');
    state = 'playing';
    t0 = performance.now();
    count = 0; elapsed = 0;
    spawnAcc = 0; nextSpawnGap = SPAWN_MIN; lastTime = 0;
    bag = [];
    clearItems();
    for(var i = 0; i < 3; i++) spawnItem();
    updateCounter();
    el.hint.classList.remove('hidden');
  }

  function finishGame(){
    state = 'over';
    elapsed = (performance.now() - t0) / 1000;
    clearItems();
    el.resultTime.textContent = elapsed.toFixed(2) + '초';
    el.resultBest.textContent = '전체 최고기록 확인 중...';
    el.resultBest.classList.remove('new');
    el.overOverlay.hidden = false;

    var insertReqRaw = logEvent('game_complete', elapsed);
    if(!insertReqRaw){
      el.resultBest.textContent = '';
      return;
    }
    var insertReq = Promise.resolve(insertReqRaw); // thenable을 실제 Promise로 한 번만 감싸서, 여러 번 .then()해도 insert가 중복 실행되지 않게 함
    function delay(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

    insertReq.then(function(){
      return delay(300); // insert 직후 바로 읽으면 반영 전일 수 있어 살짝 텀을 둠
    }).then(function(){
      return sbClient.from('best_times').select('best_value').eq('game', GAME_NAME).single();
    }).then(function(res){
      var data = res && res.data;
      globalBest = (data && data.best_value != null) ? parseFloat(data.best_value) : elapsed;
      var isNewRecord = elapsed <= globalBest + 0.005;
      el.resultBest.textContent = isNewRecord ? '전체 1위 기록 달성!' : '전체 최고기록 ' + globalBest.toFixed(2) + '초';
      el.resultBest.classList.toggle('new', isNewRecord);
    }).catch(function(){
      el.resultBest.textContent = '';
    });

    // 방금 낸 내 기록이 당연히 5위 안에 들어야 하는데 아직 안 보이면, 반영이 늦은 걸로 보고 한 번 더 조회해본다
    function fetchLeaderboard(attempt){
      return sbClient.from('leaderboard').select('nickname,value').eq('game', GAME_NAME).order('value', { ascending:true }).limit(5).then(function(res){
        var rows = (res && res.data) || [];
        var worst = rows.length ? parseFloat(rows[rows.length - 1].value) : null;
        var shouldBeIn = rows.length < 5 || (worst != null && elapsed <= worst + 0.005);
        var isIn = rows.some(function(r){ return r.nickname === nickname && Math.abs(parseFloat(r.value) - elapsed) < 0.005; });
        if(shouldBeIn && !isIn && attempt < 2){
          return delay(500).then(function(){ return fetchLeaderboard(attempt + 1); });
        }
        return rows;
      });
    }

    insertReq.then(function(){
      return delay(300);
    }).then(function(){
      return fetchLeaderboard(0);
    }).then(function(rows){
      renderLeaderboard(rows);
    }).catch(function(){
      el.leaderboard.innerHTML = '';
    });
  }

  function renderLeaderboard(rows){
    el.leaderboard.innerHTML = '';
    rows.forEach(function(row, i){
      var li = document.createElement('li');
      var isMe = row.nickname === nickname && Math.abs(parseFloat(row.value) - elapsed) < 0.005;
      if(isMe) li.className = 'me';
      li.innerHTML = '<span class="rank">' + (i+1) + '</span>'
        + '<span class="nick"></span>'
        + '<span class="time">' + parseFloat(row.value).toFixed(2) + '초</span>';
      li.querySelector('.nick').textContent = row.nickname;
      el.leaderboard.appendChild(li);
    });
  }

  // ---------- 타자 치듯 한 글자씩 보여주기 ----------
  function typeHtml(targetEl, html, onDone){
    var tokens = html.match(/<[^>]+>|[\s\S]/g) || [];
    var i = 0, finished = false;
    targetEl.innerHTML = '';
    function step(){
      if(finished) return;
      if(i >= tokens.length){ finished = true; if(onDone) onDone(); return; }
      var tok = tokens[i];
      targetEl.innerHTML += tok;
      i++;
      setTimeout(step, /^<[^>]+>$/.test(tok) ? 0 : 60);
    }
    step();
    return {
      skip: function(){
        if(finished) return;
        finished = true;
        targetEl.innerHTML = html;
        if(onDone) onDone();
      }
    };
  }

  function setupTapStep(dialogueEl, textEl, nextEl, html, onAdvance){
    var typer = null, done = false;
    nextEl.hidden = true;
    typer = typeHtml(textEl, html, function(){ done = true; nextEl.hidden = false; });
    dialogueEl.onclick = function(){
      if(!done){ typer.skip(); return; }
      onAdvance();
    };
  }

  setupTapStep(el.introDialogue, el.introText, el.introNext,
    '안녕하세요<br>쿼카섬에 오신걸 환영합니다!',
    function(){
      el.introDialogue.hidden = true;
      el.goalDialogue.hidden = false;
      typeGoalStep();
    });

  function typeGoalStep(){
    setupTapStep(el.goalDialogue, el.goalText, el.goalNext,
      '배고픈 쿼카에게 나뭇잎 <b>' + GOAL + '</b>개만<br>골라서 빨리 줘보세요!<br>고기는 못 먹어용 ㅡㅡ',
      openNamingModal);
  }

  function openNamingModal(){
    el.goalDialogue.hidden = true; // 2번째 화면 텍스트/CTA는 깔끔하게 지우고 모달만 띄움
    el.startOverlay.hidden = false;
    setTimeout(function(){ el.nicknameInput.focus(); }, 150);
  }

  el.nicknameInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); el.startBtn.click(); }
  });
  el.startBtn.addEventListener('click', function(){
    var nick = (el.nicknameInput.value || '').trim().slice(0,8) || '익명';
    nickname = nick;
    try { localStorage.setItem(NICK_KEY, nick); } catch(e){}
    startGame();
  });
  el.restartBtn.addEventListener('click', startGame);
  el.retryBtn.addEventListener('click', startGame);
  el.applyBtn.addEventListener('click', function(){
    logEvent('apply_click');
    window.open(APPLY_URL, '_blank', 'noopener,noreferrer');
  });

  // ---------- 공유 ----------
  function shareText(){
    // 카카오 링크 미리보기는 URL별로 서버에 캐싱돼서, 이미지 추가 전 공유됐던 적 있는
    // 기본 URL은 계속 옛날 카드로 뜸 - 쿼리스트링을 붙여 매번 새 URL로 취급되게 함
    return '쿼카한테 나뭇잎 ' + GOAL + '개 골라 먹이기! ' + elapsed.toFixed(2) + '초 기록!\n'
      + location.href.split(/[?#]/)[0] + '?v=1' + '\n#나뭇잎러시 #쿼카섬';
  }
  function drawCover(g, img, x, y, w, h){
    var ir = img.naturalWidth / img.naturalHeight, or = w / h;
    var sw, sh, sx, sy;
    if(ir > or){ sh = img.naturalHeight; sw = sh * or; sx = (img.naturalWidth - sw) / 2; sy = 0; }
    else { sw = img.naturalWidth; sh = sw / or; sx = 0; sy = (img.naturalHeight - sh) / 2; }
    g.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }
  function roundedRectPath(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x+r, y);
    g.arcTo(x+w, y, x+w, y+h, r);
    g.arcTo(x+w, y+h, x, y+h, r);
    g.arcTo(x, y+h, x, y, r);
    g.arcTo(x, y, x+w, y, r);
    g.closePath();
  }
  function resultImageFile(){
    var W = 600, H = 800;
    var c = document.createElement('canvas');
    c.width = W; c.height = H;
    var g = c.getContext('2d');

    // 배경: 쿼카섬 배경 사진을 꽉 채워서 깔기
    if(shareBgImg && shareBgImg.complete && shareBgImg.naturalWidth){
      drawCover(g, shareBgImg, 0, 0, W, H);
    } else {
      g.fillStyle = '#bdeeff'; g.fillRect(0, 0, W, H);
    }

    // 쿼카섬 게임이랑 같은 쿼카 사진을 손 벌린 포즈 그대로 가운데에
    if(shareHeroImg && shareHeroImg.complete && shareHeroImg.naturalWidth){
      var heroW = 360, heroH = heroW * (shareHeroImg.naturalHeight / shareHeroImg.naturalWidth);
      g.save();
      g.shadowColor = 'rgba(0,0,0,.25)'; g.shadowBlur = 24; g.shadowOffsetY = 14;
      g.drawImage(shareHeroImg, (W-heroW)/2, 150, heroW, heroH);
      g.restore();
    }

    // 하단 결과 카드
    var cardX = 40, cardY = 548, cardW = W-80, cardH = 210;
    g.save();
    g.shadowColor = 'rgba(0,0,0,.2)'; g.shadowBlur = 20; g.shadowOffsetY = 8;
    roundedRectPath(g, cardX, cardY, cardW, cardH, 22);
    g.fillStyle = '#fffdf8'; g.fill();
    g.restore();
    roundedRectPath(g, cardX, cardY, cardW, cardH, 22);
    g.lineWidth = 3; g.strokeStyle = '#3a2a1c'; g.stroke();

    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#33251a';
    g.font = '700 32px "Ongeulip"'; g.fillText('🍃 나뭇잎 러시', W/2, cardY+42);
    g.font = '700 22px "Ongeulip"'; g.fillText(GOAL + '개 완주', W/2, cardY+80);
    g.fillStyle = '#c1502e';
    g.font = '700 64px "Ongeulip"'; g.fillText(elapsed.toFixed(2) + '초', W/2, cardY+140);
    g.fillStyle = '#33251a';
    g.font = '700 18px "Ongeulip"';
    if(globalBest != null) g.fillText('전체 최고기록 ' + globalBest.toFixed(2) + '초', W/2, cardY+185);

    var bin = atob(c.toDataURL('image/png').split(',')[1]);
    var buf = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    return new File([buf], 'leaf-rush-result.png', { type:'image/png' });
  }
  el.shareBtn.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  el.shareBtn.addEventListener('click', function(){
    logEvent('share_click');
    var text = shareText();
    var file = null;
    try { file = resultImageFile(); } catch(e){}
    if(file && navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ text:text, files:[file] }).catch(function(){});
      return;
    }
    if(navigator.share){
      navigator.share({ text:text }).catch(function(){});
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        el.shareBtn.textContent = '복사했어요!';
        setTimeout(function(){ el.shareBtn.textContent = '공유하기'; }, 1500);
      }).catch(function(){});
    }
  });

  document.addEventListener('keydown', function(e){
    if(state === 'over' && (e.key === ' ' || e.key === 'Enter') && document.activeElement !== el.shareBtn){
      e.preventDefault();
      startGame();
    }
  });
})();
</script>
